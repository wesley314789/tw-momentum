name: gex-morning-telegram

on:
  schedule:
    # 台北 07:55 啟動、程式最早 08:00 發；08:20 補跑。
    # 避開整點較容易延遲的 GitHub 排程尖峰。
    - cron: "55 23 * * 0-5"
    - cron: "20 0 * * 1-6"
  workflow_dispatch:
    inputs:
      demo:
        description: "立即發送一則收盤資料測試訊息（不占用正式早報）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy requests

      - name: Refresh GEX preopen snapshot
        continue-on-error: true
        run: python scripts/txo_gex.py

      - name: Send fresh GEX snapshot to Telegram
        id: send
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            python scripts/gex_morning_telegram.py --demo
          else
            python scripts/gex_morning_telegram.py --send
          fi

      - name: Send newly listed momentum stocks to Telegram
        id: stocks
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.demo != true }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/momentum_morning_telegram.py --send

      - name: Commit GEX and notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex_history.csv docs/data/gex_latest.json docs/data/gex_debug.json data/gex_telegram_state.json data/momentum_telegram_state.json
          if git diff --cached --quiet; then
            echo "沒有變更。"
            exit 0
          fi
          git commit -m "data: GEX morning $(date +%F)"
          for i in 1 2 3; do
            if git -c rebase.autoStash=true pull --rebase -q && git push; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Report Telegram failure
        if: steps.send.outcome == 'failure' || steps.stocks.outcome == 'failure'
        run: exit 1
