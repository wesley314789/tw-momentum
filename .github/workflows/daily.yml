name: daily-update

on:
  schedule:
    # 台北 21:30 = UTC 13:30,週一到週五
    # 證交所 13:30 收盤、期交所日盤 13:45 收盤,但期交所選擇權結算價要再晚不少
    # 才會齊全(實測台北 20:11 已完整),加上 GitHub 排程常誤點,所以留到晚上。
    #
    # runner 是 UTC,腳本用 date.today() 取交易日。台灣交易日 D 收盤於 UTC D 05:45,
    # 而 UTC 日期要到 UTC D+1 00:00 才跳日,因此 UTC 06:00~23:59 之間 today() 都會
    # 等於正確的 D。要避開的是 UTC 00:00~05:45(台北 08:00~13:45),那段會抓到
    # 尚未收盤的當日。
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests numpy scipy

      - name: Run stock pipeline
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Run GEX pipeline
        continue-on-error: true
        run: python scripts/txo_gex.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv.gz docs/data/latest.json data/gex_history.csv docs/data/gex_latest.json
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push
