name: daily-update

on:
  schedule:
    # 台北 07:00(隔日早上,開盤前) = UTC 23:00
    #
    # UTC 週一 23:00 = 台北週二 07:00,涵蓋的是週一那個交易日;UTC 週五 23:00
    # = 台北週六 07:00,涵蓋週五。所以 UTC 的 1-5 剛好對應交易日週一到週五,
    # 不需要額外偏移星期。
    #
    # 排在隔天早上的好處:期交所當日 OI 何時發布我們還沒量出來(只確定台北
    # 20:11 已經有了),但隔天早上一定齊全,等於完全繞開這個未知數。
    #
    # 腳本用台北當地日期推算交易日(taipei_today()),不是 runner 的 UTC 日期,
    # 所以排程時間再怎麼移動都不會抓錯交易日。
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests numpy scipy

      - name: Run stock pipeline
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Run GEX pipeline
        continue-on-error: true
        run: python scripts/txo_gex.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv.gz docs/data/latest.json data/gex_history.csv docs/data/gex_latest.json
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push
