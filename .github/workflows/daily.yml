name: daily-update

on:
  schedule:
    # 台北 17:00 = UTC 09:00,週一到週五
    # 證交所 13:30 收盤、期交所日盤 13:45 收盤,但期交所選擇權結算價要再晚一些
    # 才會齊全,加上 GitHub 排程本身常誤點十幾分鐘,所以留三小時以上緩衝。
    # 注意: runner 是 UTC,腳本用 date.today() 取當日,排程不可晚於 UTC 16:00,
    # 否則 UTC 日期會落後台北一天而抓錯日。
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests numpy scipy

      - name: Run stock pipeline
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Run GEX pipeline
        continue-on-error: true
        run: python scripts/txo_gex.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv.gz docs/data/latest.json data/gex_history.csv docs/data/gex_latest.json
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push
