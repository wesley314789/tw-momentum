name: daily-update

on:
  schedule:
    # 一天兩班。腳本用台北當地日期推算交易日(taipei_today()),不是 runner 的
    # UTC 日期, 所以排程時間怎麼移動都不會抓錯交易日。

    # 【第一班】台北 15:30 = UTC 07:30 —— 算出「當日」的位階
    # 原本排台北 14:30, 太早了。期交所日盤 13:45 收盤, probe-taifex 實測 OI
    # 台北 14:39 才發布; 證交所與櫃買的個股資料也差不多是這個時間。2026-08-28
    # 那班準時在 06:25 UTC(台北 14:25)跑, 三個來源都還沒出當日資料, 整班空轉,
    # 網站就停在前一天。以往能矇到是因為排程誤點把它推晚了 —— 靠誤點來對時間
    # 顯然不是辦法, 直接往後排一小時才是。
    # 只怕太早(資料還沒發布), 不怕太晚: 誤點只會讓資料更齊全。
    - cron: "30 7 * * 1-5"

    # 【第二班】台北 19:00 = UTC 11:00 —— 純粹的保險
    # 第一班若遇上交易所延遲發布、來源 403、或 GitHub 整班跳過(都發生過),
    # 這班會把缺口補起來。daily_update() 是掃區間補洞的, 沒缺口就什麼都不寫,
    # 重跑不會有副作用, 所以多排一班的成本只有兩分鐘的 runner 時間。
    - cron: "0 11 * * 1-5"

    # 【第三班】台北 07:00(隔日開盤前) = UTC 23:00 —— 補上盤前快照
    # 此時當日夜盤(前日 15:00~當日 05:00)已收, 期交所已發布夜盤收盤價, 但當日
    # 日盤還沒開、沒有 OI。這班用夜盤價重算 gex_now/regime, 產生 preopen_*。
    # UTC 週一 23:00 = 台北週二 07:00, 涵蓋週一那個交易日; UTC 週五 23:00 =
    # 台北週六 07:00, 涵蓋週五。所以 UTC 的 1-5 剛好對應交易日週一到週五。
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests numpy scipy

      - name: Run stock pipeline
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Run GEX pipeline
        continue-on-error: true
        run: python scripts/txo_gex.py

      # 美股靠 Yahoo 的非官方 API, 被擋的機率比前兩條高, 一樣不能拖累其他人
      - name: Run US breadth pipeline
        continue-on-error: true
        run: python scripts/us_breadth.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/index.csv.gz 一定要在清單裡:它是算 RS 用的大盤歷史, 每次執行
          # 都會改寫。漏掉的話 checkout 拿到的永遠是上次 commit 的版本, 跑完
          # 追加當天再丟棄 —— 大盤歷史會一天天缺漏, 而 RS 用它的 63/126/189/252
          # 日報酬當基準, 缺日會讓回看窗口整個偏移。它也是 rebase 前唯一的
          # 未暫存變更, 會擋住 pull。
          git add data/theme_overrides.csv data/history.csv.gz data/index.csv.gz docs/data/latest.json data/gex_history.csv docs/data/gex_latest.json data/shares.csv data/breadth.csv data/us_breadth.csv docs/data/us_latest.json
          if git diff --cached --quiet; then
            echo "沒有變更,不需要 commit。"
            exit 0
          fi
          git commit -m "data: $(date +%F)"
          # 推之前先 rebase。排程的 Claude 題材任務也會推同一個 repo(而且時間
          # 就在早班前後), 只要它在我們 checkout 之後推了東西, 直接 push 就會
          # 被拒絕而整批資料丟失 —— 2026-08-26 就是這樣掉了一天的個股資料。
          for i in 1 2 3; do
            # --autostash: 萬一還有沒列進 git add 的產出檔, 不要讓它擋住 rebase
            if git -c rebase.autoStash=true pull --rebase -q && git push; then
              echo "推送成功(第 $i 次嘗試)"
              exit 0
            fi
            echo "推送失敗,10 秒後重試 ($i/3)"
            sleep 10
          done
          echo "重試三次仍失敗。"
          exit 1
